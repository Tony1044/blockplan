services:
  blockplan:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8080"
      # Reach Ollama running on the host machine.
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    restart: unless-stopped
